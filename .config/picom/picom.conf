# Enable transparency
opacity-rule = ["90:class_g = 'Alacritty'"];  # Adjust 90 to your preferred transparency level (0–100)

# Backend (choose glx, xrender, or egl)
backend = "glx";

# Enable transparent windows
enable = true;

# Optional: Fade-in/out effects
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

