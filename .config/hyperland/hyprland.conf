# Basic settings
monitor=*,preferred,auto,1
input=*,kb_layout us

# Background (Wallpaper)
exec = swaybg -i ~/pix/wall/bg.jpg -m fill

# Cursor
exec = hyprctl setcursor default 24

# Terminal (change to your preferred terminal)
bind=SUPER+Return,exec,kitty

# Launcher (replace with your preferred launcher)
bind=SUPER+d,exec,rofi --show drun

# Exit Hyperland
bind=SUPER+Shift+q,exec,pkill -KILL Hyprland

# Window management
bind=SUPER+w,split,vert
bind=SUPER+d,split,horiz
bind=SUPER+f,fullscreen
bind=SUPER+q,close

# Focus management
bind=SUPER+t,circlefocus

# Workspace management
bind=SUPER+1,workspace,1
bind=SUPER+2,workspace,2
bind=SUPER+3,workspace,3
bind=SUPER+4,workspace,4
bind=SUPER+5,workspace,5

# Animations
animation=windows,1
animation_speed=7

# Borders
general:border_size = 2
general:gaps_in = 5
general:gaps_out = 5
decoration:active_color = rgba(0, 120, 215, 1)
decoration:inactive_color = rgba(60, 60, 60, 1)

# Optional: Status bar (Waybar or similar)
exec = waybar

exec Hyperland

